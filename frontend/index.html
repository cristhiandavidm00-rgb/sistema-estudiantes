<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estudiantes v2</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="toast-container" aria-live="polite"></div>

<!-- ============ LOGIN / REGISTRO ============ -->
<section id="auth-view" class="container auth-box">
    <h1>Sistema de Gestión de Estudiantes</h1>
    <div class="tabs">
        <button type="button" id="tab-login" class="tab active">Iniciar sesión</button>
        <button type="button" id="tab-registro" class="tab">Registrarse</button>
    </div>

    <form id="login-form" novalidate>
        <div class="form-group"><label for="login-username">Usuario</label>
            <input type="text" id="login-username" required autocomplete="username">
            <small class="error" data-error-for="login-username"></small></div>
        <div class="form-group"><label for="login-password">Contraseña</label>
            <input type="password" id="login-password" required autocomplete="current-password">
            <small class="error" data-error-for="login-password"></small></div>
        <button type="submit">Entrar</button>
    </form>

    <form id="registro-form" novalidate style="display:none;">
        <div class="form-group"><label for="reg-username">Usuario</label>
            <input type="text" id="reg-username" required minlength="3" maxlength="50" autocomplete="username">
            <small class="error" data-error-for="reg-username"></small></div>
        <div class="form-group"><label for="reg-email">Email</label>
            <input type="email" id="reg-email" required autocomplete="email">
            <small class="error" data-error-for="reg-email"></small></div>
        <div class="form-group"><label for="reg-password">Contraseña (mín. 6)</label>
            <input type="password" id="reg-password" required minlength="6" autocomplete="new-password">
            <small class="error" data-error-for="reg-password"></small></div>
        <button type="submit">Crear cuenta</button>
    </form>
</section>

<!-- ============ APLICACIÓN ============ -->
<main id="app-view" class="container" style="display:none;">
    <header class="topbar">
        <h1>Sistema de Gestión de Estudiantes</h1>
        <div class="userbox">
            <span id="user-info"></span>
            <button type="button" id="logout-btn" class="btn-secundario">Cerrar sesión</button>
        </div>
    </header>

    <!-- Dashboard de estadísticas -->
    <section class="stats" id="stats">
        <div class="stat-card"><span class="stat-num" id="stat-total">0</span><span>Estudiantes</span></div>
        <div class="stat-card"><span class="stat-num" id="stat-prom">0</span><span>Edad promedio</span></div>
        <div class="stat-card"><span class="stat-num" id="stat-rango">-</span><span>Rango de edad</span></div>
        <div class="stat-card"><span class="stat-num" id="stat-carrera">-</span><span>Carrera principal</span></div>
    </section>

    <!-- Formulario -->
    <div class="form-container">
        <h2 id="form-title">Agregar Nuevo Estudiante</h2>
        <form id="estudiante-form" novalidate>
            <input type="hidden" id="estudiante-id">
            <div class="form-grid">
                <div class="form-group"><label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required minlength="2" maxlength="100">
                    <small class="error" data-error-for="nombre"></small></div>
                <div class="form-group"><label for="apellido">Apellido</label>
                    <input type="text" id="apellido" required minlength="2" maxlength="100">
                    <small class="error" data-error-for="apellido"></small></div>
                <div class="form-group"><label for="edad">Edad</label>
                    <input type="number" id="edad" min="15" max="100" required>
                    <small class="error" data-error-for="edad"></small></div>
                <div class="form-group"><label for="carrera">Carrera</label>
                    <input type="text" id="carrera" required minlength="3" maxlength="150">
                    <small class="error" data-error-for="carrera"></small></div>
                <div class="form-group"><label for="email">Email (opcional)</label>
                    <input type="email" id="email" maxlength="150">
                    <small class="error" data-error-for="email"></small></div>
                <div class="form-group"><label for="telefono">Teléfono (opcional)</label>
                    <input type="text" id="telefono" maxlength="20" placeholder="+57 310 1234567">
                    <small class="error" data-error-for="telefono"></small></div>
            </div>
            <div class="button-group">
                <button type="submit" id="submit-btn">Agregar Estudiante</button>
                <button type="button" id="cancel-btn" class="btn-secundario" style="display:none;">Cancelar</button>
            </div>
        </form>
    </div>

    <!-- Tabla -->
    <div class="table-container">
        <h2>Lista de Estudiantes</h2>
        <div class="toolbar">
            <input type="search" id="search" placeholder="Buscar por nombre, apellido o carrera...">
            <select id="orden" aria-label="Ordenar por">
                <option value="id">ID</option><option value="nombre">Nombre</option>
                <option value="apellido">Apellido</option><option value="edad">Edad</option>
                <option value="carrera">Carrera</option>
            </select>
            <select id="direccion" aria-label="Dirección">
                <option value="asc">Ascendente</option><option value="desc">Descendente</option>
            </select>
            <select id="per-page" aria-label="Items por página">
                <option value="5">5 por página</option><option value="10">10 por página</option>
                <option value="25">25 por página</option><option value="50">50 por página</option>
            </select>
        </div>
        <div class="table-scroll">
            <table id="estudiantes-table">
                <thead><tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Edad</th><th>Carrera</th>
                    <th>Email</th><th>Teléfono</th><th>Acciones</th></tr></thead>
                <tbody id="estudiantes-tbody"></tbody>
            </table>
        </div>
        <div class="pagination">
            <span id="pag-info"></span>
            <div>
                <button type="button" id="prev-btn" class="btn-secundario">« Anterior</button>
                <span id="pag-page"></span>
                <button type="button" id="next-btn" class="btn-secundario">Siguiente »</button>
            </div>
        </div>
    </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
